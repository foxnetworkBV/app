workflows:
  ios-testflight:
    name: FoxNetwork TestFlight RELEASE
    max_build_duration: 120
    integrations:
      app_store_connect: FoxNetwork App Store Connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: be.foxnetwork.app
    scripts:
      - name: Verify project and release mode
        script: |
          set -euo pipefail
          echo "FoxNetwork production build 1.0.6 (11)"
          flutter --version
          flutter config --no-enable-swift-package-manager
          grep -q 'flutter build ipa --release' codemagic.yaml
          grep -q 'version: 1.0.6+11' pubspec.yaml
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = be.foxnetwork.app;' ios/Runner.xcodeproj/project.pbxproj

      - name: Clean build environment
        script: |
          set -euo pipefail
          flutter clean
          rm -rf .dart_tool build
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/* || true

      - name: Install Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze
          flutter test

      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          test -f Podfile.lock
          test -f Pods/Manifest.lock
          cmp Podfile.lock Pods/Manifest.lock
          cd ..

      - name: Configure App Store signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
          test -f /Users/builder/export_options.plist

      - name: Build signed TestFlight IPA
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name=1.0.6 \
            --build-number=11 \
            --export-options-plist=/Users/builder/export_options.plist
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
