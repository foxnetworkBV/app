workflows:
  ios-testflight:
    name: FoxNetwork TestFlight RELEASE
    max_build_duration: 120
    integrations:
      app_store_connect: FoxNetwork App Store Connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: be.foxnetwork.app
    scripts:
      - name: Verify release workflow
        script: |
          set -e
          echo "Building TestFlight RELEASE — never debug"
          flutter --version
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter and iOS completely
        script: |
          set -e
          flutter clean
          rm -rf .dart_tool build
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/CocoaPods

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Recreate CocoaPods integration
        script: |
          set -e
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
          test -f Podfile.lock
          test -f Pods/Manifest.lock
          cmp Podfile.lock Pods/Manifest.lock
          cd ..

      - name: Set up App Store signing
        script: |
          set -e
          xcode-project use-profiles
          test -f /Users/builder/export_options.plist

      - name: Build TestFlight IPA in release mode
        script: |
          set -e
          flutter build ipa --release \
            --build-name=1.2.2 \
            --build-number=39 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
