name: foxnetwork_app
description: FoxNetwork customer app for hosting, billing, and support.
publish_to: "none"
version: 1.2.2+46

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/foxnetwork_mark.png
    - assets/foxnetwork_logo.png
